# HealthChat – nginx-alternativ till deploy/Caddyfile (TLS-1 i board.md).
# Använd detta bara om servern redan kör nginx; Caddy är enklare och sköter
# certifikatförnyelsen själv.
#
# Installera som /etc/nginx/sites-available/healthchat och länka till
# sites-enabled. Certifikat hämtas separat med certbot:
#   sudo certbot certonly --nginx -d healthchat.andrix.se
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name healthchat.andrix.se;

    # Låt certbot besvara ACME-utmaningen på port 80.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                    # nginx < 1.25: använd "listen 443 ssl http2;" i stället
    server_name healthchat.andrix.se;

    ssl_certificate     /etc/letsencrypt/live/healthchat.andrix.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/healthchat.andrix.se/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS. Se TLS-2 i board.md: sätt denna här ELLER i appen, inte båda.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI-svaret genereras i sin helhet innan första byten skickas och kan
        # ta över en minut. nginx default är 60s, vilket klipper svaret.
        proxy_read_timeout 300s;
    }

    # SSE-strömmen för AI-chatten. Utan detta block buffrar nginx svaret och
    # chatten ser ut att hänga: inget syns förrän hela strömmen är klar.
    location /api/ai/chat {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering          off;
        proxy_cache              off;
        chunked_transfer_encoding off;
        proxy_read_timeout       600s;
    }
}
