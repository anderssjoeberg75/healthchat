# Run HealthChat with:  docker compose -f webapp/docker-compose.yml up -d --build
services:
  healthchat:
    build:
      context: ..
      dockerfile: webapp/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Public URL of the deployment — OAuth redirect URIs are built from it.
      HEALTHCHAT_BASE_URL: ${HEALTHCHAT_BASE_URL:-http://localhost:8000}
      # Generated and persisted in the data volume if left unset.
      HEALTHCHAT_SECRET_KEY: ${HEALTHCHAT_SECRET_KEY:-}
      # Set to 1 once every user has an account (the first account is always allowed).
      HEALTHCHAT_DISABLE_REGISTRATION: ${HEALTHCHAT_DISABLE_REGISTRATION:-0}
      # Set to 1 when serving over HTTPS so the session cookie is HTTPS-only.
      HEALTHCHAT_COOKIE_SECURE: ${HEALTHCHAT_COOKIE_SECURE:-0}
    volumes:
      - healthchat-data:/data

volumes:
  healthchat-data:
